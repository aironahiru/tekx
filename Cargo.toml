[package]
name = "tekx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A math-first document language and self-contained compiler to accessible, copy-perfect PDF"
license = "Apache-2.0"
repository = "https://github.com/aironahiru/tekx"
readme = "README.md"
keywords = ["typesetting", "math", "pdf", "accessibility", "compiler"]
categories = ["command-line-utilities", "text-processing", "mathematics"]
exclude = ["research/", "target/"]

[lib]
name = "tekx"
path = "src/lib.rs"

[[bin]]
name = "tekx"
path = "src/main.rs"

# No dependencies: tekx owns its full stack (parser, fonts, layout, PDF).
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
